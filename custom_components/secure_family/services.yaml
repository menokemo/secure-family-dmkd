set_config:
  name: Set family configuration
  description: >-
    Publish the central family configuration. Administrators only. The app
    normally calls this for you via the "Publish as family config" button.
  fields:
    config:
      name: Configuration
      description: The full family configuration object (JSON).
      required: true
      example: '{"cameras": ["camera.front_door"], "alarmEntityId": "alarm_control_panel.alarmo"}'
      selector:
        object:

rollback:
  name: Roll back configuration
  description: >-
    Restore a previous family configuration. With no version, restores the most
    recent previous one. Administrators only.
  fields:
    version:
      name: Version
      description: The version number to restore. Omit to restore the latest previous version.
      required: false
      example: 3
      selector:
        number:
          min: 1
          mode: box

clear_config:
  name: Clear configuration
  description: >-
    Clear the central family configuration (publishes an empty config).
    Administrators only.

cleanup_stale_trackers:
  name: Clean up stale trackers
  description: >-
    Remove duplicate and stale Secure Family mobile_app device registrations and
    purge their long-term statistics. Duplicates (same device name) keep the most
    recently updated one; stale devices are those not updated for max_age_days.
    Only touches our app (app_id secure_family). Runs automatically too;
    administrators can also run it manually here.
  fields:
    max_age_days:
      name: Max age (days)
      description: >-
        Remove registrations whose location has not updated in at least this
        many days. Devices updating recently are kept.
      required: false
      default: 7
      example: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box
    dry_run:
      name: Preview only
      description: >-
        List the Secure Family registrations (and which ones are stale) without
        deleting anything. Use this first to review before cleaning.
      required: false
      default: false
      selector:
        boolean:

request_live_location:
  name: Request live location
  description: >-
    Ask a family member's device to send its location at a fast rate for a
    short while (used by the live-view feature). Available to any family member.
  fields:
    entity_id:
      name: Person tracker
      description: The device_tracker entity_id of the family member to request live location for.
      required: true
      example: device_tracker.secure_family_mena
      selector:
        entity:
          domain: device_tracker

check_device:
  name: Check device registration
  description: >-
    Called by the app before registering. If the same phone already has a valid
    active registration, returns action "reuse" with its webhook_id (so no new
    mobile_app device is created — prevents duplicates/noise). Otherwise returns
    action "register". Also sets the device name to the user's name (or the
    custom name). Fields: device_id (stable per-phone id), name (optional custom).
  fields:
    device_id:
      name: Physical device id
      required: true
      selector:
        text:
    name:
      name: Custom device name
      description: Optional. Empty = use the signed-in user's name.
      required: false
      selector:
        text:

request_registration:
  name: Request device registration
  description: >-
    The app calls this after registering with mobile_app to claim the single
    active-device slot for the signed-in user. Returns "approved" for the first
    or the same physical device, or "pending" (admin approval required) when the
    account is already active on another device.
  fields:
    device_id:
      name: Physical device id
      description: Stable per-phone id (ANDROID_ID).
      required: true
      example: a1b2c3d4e5f6
      selector:
        text:
    webhook_id:
      name: Webhook id
      description: The mobile_app webhook id this device just registered with.
      required: true
      selector:
        text:
    name:
      name: Device name
      description: Friendly device name shown to the admin.
      required: true
      selector:
        text:

approve_registration:
  name: Approve device registration
  description: >-
    Approve a pending device takeover. Admins pass request_id from their app;
    the new device passes the admin-provided code. The old device is signed out.
  fields:
    request_id:
      name: Request id
      description: The pending request id (admin approval from the app).
      required: false
      selector:
        text:
    code:
      name: Approval code
      description: The 6-digit code the admin provided (entered on the new device).
      required: false
      selector:
        text:

deny_registration:
  name: Deny device registration
  description: Reject a pending device request and remove its stray registration. Administrators only.
  fields:
    request_id:
      name: Request id
      description: The pending request id to deny.
      required: true
      selector:
        text:

list_pending_registrations:
  name: List pending device requests
  description: >-
    Return pending device-approval requests with their codes. Administrators
    only — this is how an admin's app gets the code securely.
